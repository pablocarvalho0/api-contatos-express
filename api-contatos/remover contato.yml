info:
  name: remover contato
  type: http
  seq: 18
  tags:
    - escrita

http:
  method: DELETE
  url: "{{baseUrl}}/contacts/{{novoContatoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("devolve o contato removido", function() {
          expect(res.body.contact.id).to.equal(bru.getVar("novoContatoId"));
          expect(res.body.contact.name).to.equal("Fulano Editado");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Fecha o ciclo e limpa o banco

  Remove o contato criado em `criar contato` e editado em `atualizar contato` —
  por isso o teste confere o nome `Fulano Editado`: ele prova, de quebra, que o
  update anterior persistiu de verdade e não só devolveu um corpo bonito.

  É esta requisição que deixa a coleção repetível. Sem ela, cada `npm run test`
  deixaria um contato órfão no banco.

  ## Por que `200` com corpo, e não `204`

  `204 No Content` é o padrão mais comum para remoção, e seria defensável aqui. A
  escolha foi devolver `200` com o contato apagado no corpo, porque essa é a
  última chance de o cliente ver o que se perdeu — útil para log, para uma tela
  de confirmação ou para um "desfazer" que precise dos dados de volta.

  O custo é que o cliente não pode assumir corpo vazio. Escolha consciente, não
  descuido.

  ## O que vai junto

  A FK de `contact_groups` tem `ON DELETE CASCADE`: apagar o contato apaga as
  associações dele com grupos. O comportamento está decidido **no SQL**, não no
  código — não há linha em `services/contacts.ts` que trate disso, e quem lê só o
  TypeScript não vê o efeito acontecendo.

  É o certo aqui (associação sem contato não significa nada), mas registrar onde
  a regra mora evita a surpresa de amanhã.
